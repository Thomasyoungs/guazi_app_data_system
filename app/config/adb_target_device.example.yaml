# Example only. Keep the real device binding in adb_target_device.yaml.
# The real file is local-only and must not be committed.
production_device:
  active_adb_serial: "PLACEHOLDER_PRODUCTION_ADB_SERIAL"
  device_alias: "PLACEHOLDER_PRODUCTION_DEVICE_ALIAS"

active_adb_serial: "PLACEHOLDER_ACTIVE_ADB_SERIAL"
device_alias: "PLACEHOLDER_ACTIVE_DEVICE_ALIAS"
strict_device_selection: true
allow_default_when_single_device: false
adb_runtime_env_mode: "user_shell"
use_isolated_adb_home: false
adb_path_strategy: "path_first"
explicit_adb_vendor_keys: ""

temporary_device_override:
  enabled: false
  temporary_adb_serial: "PLACEHOLDER_TEMPORARY_ADB_SERIAL"
  temporary_device_alias: "PLACEHOLDER_TEMPORARY_DEVICE_ALIAS"
  temporary_device_model: "PLACEHOLDER_DEVICE_MODEL"
  original_adb_serial: "PLACEHOLDER_ORIGINAL_ADB_SERIAL"
  original_device_alias: "PLACEHOLDER_ORIGINAL_DEVICE_ALIAS"
  reason: "PLACEHOLDER_REASON"
  created_at: "PLACEHOLDER_CREATED_AT"
