# 飞书集成配置
feishu_integration:
  enabled: true
  api_timeout: 30
  dry_run: true  # 设置为false以启用真实API调用
  
# 飞书应用凭证（在生产环境中应通过环境变量提供）
app_credentials:
  # app_id: "your_app_id_here"
  # app_secret: "your_app_secret_here"
  
# 消息处理配置
message_processing:
  default_reply: "已收到您的车辆信息，正在处理中..."
  error_reply: "处理您的请求时发生错误，请检查输入格式。"
  
# 任务存储配置
task_storage:
  root_directory: "./tasks"
  retention_days: 30
